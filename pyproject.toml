[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btctrack"
version = "0.1.0"
description = "Self-hosted, privacy-preserving Bitcoin portfolio tracker."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.36",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiorpcx>=0.23",
    "bip-utils>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "altair>=5.3",
    "bcrypt>=4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btctrack = ["prices/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
